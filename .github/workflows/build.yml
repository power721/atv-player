name: Build Packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  MPV_DLL_URL: https://github.com/power721/atv-player/releases/download/v0.97.0/libmpv-2.dll
  MPV_DLL_SHA256: 5825ffd2bef6fd6a4b78016d5890c6c9dedb16a31828a1c749be89eacf9e20ae

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
            macos_runtime: homebrew
          - os: macos-15-intel
            platform: macos
            macos_runtime: macports
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libmpv-dev libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Cache libmpv build workspace
        if: matrix.platform == 'linux'
        uses: actions/cache@v6
        with:
          path: build/mpv-build
          key: libmpv-build-${{ runner.os }}-v1-${{ hashFiles('scripts/build_mpv.sh') }}
          restore-keys: |
            libmpv-build-${{ runner.os }}-v1-

      - name: Build libmpv (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y git meson ninja-build pkg-config nasm \
            liblua5.2-dev libxml2-dev libva-dev libvdpau-dev libxpresent-dev
          scripts/build_mpv.sh --jobs "$(nproc)"

      - name: Install Linux AppImage tool
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          echo "APPIMAGE_TOOL=$RUNNER_TEMP/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install macOS system dependencies
        if: matrix.macos_runtime == 'homebrew'
        run: brew install mpv

      # Intel macOS: Homebrew 已停发 x86_64 bottle,改用 MacPorts 官方预编译
      # 归档(darwin_24/Sequoia,最低系统 15.0)。整个 /opt/local 结果缓存,
      # 命中即跳过安装。mpv 0.41 为最后一个带 libmpv 默认变体的稳定线。
      - name: Cache MacPorts libmpv (macOS Intel)
        if: matrix.macos_runtime == 'macports'
        uses: actions/cache@v6
        with:
          path: /opt/local
          key: macports-mpv-darwin24-x86_64-v1

      - name: Install macOS Intel libmpv (MacPorts)
        if: matrix.macos_runtime == 'macports'
        run: |
          MACPORTS_PKG_URL="https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg"
          MACPORTS_PKG_SHA256="87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63"
          if [ -f /opt/local/lib/libmpv.dylib ]; then
            echo "Using cached MacPorts libmpv"
          else
            curl -fsSL -o "$RUNNER_TEMP/MacPorts.pkg" "$MACPORTS_PKG_URL"
            echo "$MACPORTS_PKG_SHA256  $RUNNER_TEMP/MacPorts.pkg" | shasum -a 256 -c -
            sudo installer -pkg "$RUNNER_TEMP/MacPorts.pkg" -target /
            sudo /opt/local/bin/port -q sync
            sudo /opt/local/bin/port -N install mpv
          fi
          test -f /opt/local/lib/libmpv.dylib
          file /opt/local/lib/libmpv.dylib | grep -q x86_64

      - name: Install Windows system dependencies
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path "mpv" | Out-Null
          Invoke-WebRequest -Uri "$env:MPV_DLL_URL" -OutFile "mpv\libmpv-2.dll"
          $actualHash = (Get-FileHash "mpv\libmpv-2.dll" -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne "$env:MPV_DLL_SHA256") {
            throw "libmpv-2.dll SHA256 mismatch: expected $env:MPV_DLL_SHA256, got $actualHash"
          }
          $mpvDll = Get-Item "mpv\libmpv-2.dll"
          Write-Host "Downloaded libmpv runtime: $($mpvDll.FullName) ($([Math]::Round($mpvDll.Length / 1MB, 2)) MB)"

      - name: Sync dependencies
        run: uv sync --frozen --group dev --group build

      - name: Resolve artifact version (POSIX)
        if: matrix.platform != 'windows'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ARTIFACT_VERSION="${GITHUB_REF_NAME#v}"
          else
            ARTIFACT_VERSION=dev
          fi
          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> "$GITHUB_ENV"

      - name: Resolve artifact version (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $artifactVersion = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $artifactVersion = 'dev'
          }
          "ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application
        run: uv run python build.py ${{ matrix.platform }}

      - name: Resolve artifact paths (POSIX)
        if: matrix.platform != 'windows'
        run: |
          ARCHIVE_NAME=$(uv run python -c "import build, os; print(build.build_archive_name('${{ matrix.platform }}', version=os.environ['ARTIFACT_VERSION']))")
          BUNDLE_PATH=$(uv run python -c "import build; print(build.bundle_path_for_target('${{ matrix.platform }}'))")
          RELEASE_ASSET_PATH=$(uv run python -c "import build, os; print(build.release_artifact_path_for_target('${{ matrix.platform }}', version=os.environ['ARTIFACT_VERSION']))")
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_PATH=$RELEASE_ASSET_PATH" >> "$GITHUB_ENV"

      - name: Resolve archive name (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archiveName = uv run python -c "import build, os; print(build.build_archive_name('${{ matrix.platform }}', version=os.environ['ARTIFACT_VERSION']))"
          $bundlePath = uv run python -c "import build; print(build.bundle_path_for_target('${{ matrix.platform }}'))"
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_PATH=$bundlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Archive Linux bundle
        if: matrix.platform == 'linux'
        run: |
          test -f "$RELEASE_ASSET_PATH"

      - name: Archive macOS bundle
        if: matrix.platform == 'macos'
        run: |
          test -d "$BUNDLE_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE_PATH" "dist/$ARCHIVE_NAME"

      - name: Archive Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path $env:BUNDLE_PATH)) {
            throw "Missing bundle path: $env:BUNDLE_PATH"
          }
          Copy-Item $env:BUNDLE_PATH "dist\$env:ARCHIVE_NAME" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # 用 os 而非 platform 命名:两个 macOS job(arm64/x64)会撞名
          name: ${{ matrix.os }}-bundle
          path: dist/${{ env.ARCHIVE_NAME }}
          retention-days: 7

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.AppImage" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body || true)"
          {
            echo "body<<EOF"
            printf '%s\n' "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: send telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHANNEL_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            atv-player 发布新版本
            版本: ${{ github.ref_name }}
            仓库: ${{ github.repository }}
            发布人: ${{ github.actor }}
            Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            更新内容:
            ${{ steps.release_notes.outputs.body }}
